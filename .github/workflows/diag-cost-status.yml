name: Diagnose cost status totals

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diag-cost-status.yml'

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aggregate embedded cost source
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, base64, gzip, json, traceback
          from collections import defaultdict

          out=[]
          def p(*x): out.append(' '.join(map(str,x)))
          try:
              text=Path('data/cost-source-v1.js').read_text(encoding='utf-8')
              m=re.search(r'STEP_COST_SOURCE_GZIP_B64="([^"]+)"', text)
              if not m: raise RuntimeError('embedded cost source not found')
              payload=gzip.decompress(base64.b64decode(m.group(1))).decode('utf-8')
              rows=json.loads(payload)
              p('TYPE',type(rows).__name__,'ROWS',len(rows))
              if rows: p('FIRST_TYPE',type(rows[0]).__name__,'FIRST_LEN',len(rows[0]) if hasattr(rows[0],'__len__') else '-')
              def at(r,i,default=''):
                  try: return r[i]
                  except Exception: return default
              def st(r): return str(at(r,12,'') or '').strip()
              def val(r):
                  try: return float(at(r,10,0) or 0)
                  except Exception: return 0.0
              raw=defaultdict(float); counts=defaultdict(int)
              for r in rows:
                  raw[st(r)] += val(r); counts[st(r)] += 1
              p('RAW_STATUS_TOTALS')
              for k in sorted(raw): p(k,'|',counts[k],'|',f'{raw[k]:.2f}')
              p('RAW_GRAND','|',f'{sum(raw.values()):.2f}')

              seen=set(); dedup=defaultdict(float); dcounts=defaultdict(int)
              for r in rows:
                  try: qty=float(at(r,9,0) or 0)
                  except Exception: qty=0.0
                  key=(str(at(r,3,'') or ''),str(at(r,5,'') or ''),str(at(r,8,'') or '').strip().upper(),qty,round(val(r),4))
                  if key in seen: continue
                  seen.add(key); dedup[st(r)] += val(r); dcounts[st(r)] += 1
              p('DEDUP_STATUS_TOTALS')
              for k in sorted(dedup): p(k,'|',dcounts[k],'|',f'{dedup[k]:.2f}')
              p('DEDUP_GRAND','|',f'{sum(dedup.values()):.2f}')

              def canon(s):
                  x=s.strip().casefold()
                  if 'não aprovado' in x or 'nao aprovado' in x: return 'Orçamento não Aprovado'
                  if x == 'comprado': return 'Comprado'
                  if x == 'cancelado': return 'Cancelado'
                  if x in ('em orçamento','em orcamento'): return 'Em Orçamento'
                  if x == 'gerar pedido': return 'Gerar Pedido'
                  if x == 'em processo de compra': return 'Em Processo de Compra'
                  return s.strip() or 'Sem status'
              norm=defaultdict(float); ncount=defaultdict(int)
              for r in rows: norm[canon(st(r))] += val(r); ncount[canon(st(r))] += 1
              p('NORMALIZED_RAW')
              for k in sorted(norm): p(k,'|',ncount[k],'|',f'{norm[k]:.2f}')
              p('NORMALIZED_GRAND','|',f'{sum(norm.values()):.2f}')
          except Exception:
              p('ERROR')
              p(traceback.format_exc())
          Path('diag-cost-status.txt').write_text('\n'.join(out)+'\n',encoding='utf-8')
          print('\n'.join(out))
          PY
      - name: Commit diagnostic result
        shell: bash
        run: |
          git config user.name 'STEP Obras Diagnostics'
          git config user.email 'actions@users.noreply.github.com'
          git add diag-cost-status.txt
          git commit -m 'chore(obras): resultado temporario do diagnostico de custos' || exit 0
          git push
